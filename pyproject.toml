[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-rag"
version = "0.1.0"
description = "A book-grounded RAG project for The Adventures of Sherlock Holmes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
semantic = ["numpy>=1.26,<3", "sentence-transformers>=5,<6", "transformers>=4.51,<5"]
generation = ["torch>=2.6,<3", "transformers>=4.51,<5", "accelerate>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
